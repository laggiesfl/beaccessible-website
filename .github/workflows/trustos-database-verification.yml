name: TrustOS database verification

# Runs in a disposable GitHub-hosted Docker environment.
# This workflow never links to or modifies a hosted Supabase project.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "scripts/trustos-migration-contract.test.cjs"
      - ".github/workflows/trustos-database-verification.yml"
  push:
    branches:
      - phase2/identity-access-design
    paths:
      - "supabase/**"
      - "scripts/trustos-migration-contract.test.cjs"
      - ".github/workflows/trustos-database-verification.yml"

permissions:
  contents: read

concurrency:
  group: trustos-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-database:
    name: Reset, full pgTAP matrix and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify migration boundary contract
        run: node --test scripts/trustos-migration-contract.test.cjs

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start disposable local Supabase
        run: supabase start

      - name: Reset database from tracked migrations
        run: supabase db reset

      - name: Run all TrustOS database tests
        run: supabase test db

      - name: Lint database
        run: supabase db lint --local --level warning --fail-on warning

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
